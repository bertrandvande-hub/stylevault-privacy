<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StyleVault – Réinitialisation du mot de passe</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #1a0a0a;
      color: #f5f0eb;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: #2a1010;
      border-radius: 20px;
      padding: 40px 32px;
      max-width: 400px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }
    .icon {
      width: 72px;
      height: 72px;
      background: #8B2020;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
      font-size: 32px;
    }
    h1 {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 12px;
      color: #f5f0eb;
    }
    p {
      font-size: 15px;
      color: #a0897a;
      line-height: 1.6;
      margin-bottom: 28px;
    }
    .btn {
      display: inline-block;
      background: #8B2020;
      color: #fff;
      border: none;
      border-radius: 50px;
      padding: 16px 32px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      width: 100%;
      transition: opacity 0.2s;
    }
    .btn:hover { opacity: 0.85; }
    .error {
      background: #3a1010;
      border: 1px solid #5a2020;
      border-radius: 12px;
      padding: 16px;
      margin-top: 20px;
      font-size: 14px;
      color: #c08070;
      display: none;
    }
    .loader {
      font-size: 14px;
      color: #a0897a;
      margin-top: 16px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">🔐</div>
    <h1>Réinitialisation du mot de passe</h1>
    <p id="desc">Ouverture de StyleVault en cours…</p>
    <a id="openBtn" class="btn" href="#" style="display:none">
      Ouvrir StyleVault
    </a>
    <div class="loader" id="loader">Veuillez patienter…</div>
    <div class="error" id="errorBox">
      <strong>Impossible d’ouvrir l’application automatiquement.</strong><br/>
      Appuyez sur le bouton ci-dessus pour ouvrir StyleVault,
      ou assurez-vous que l’application est bien installée.
    </div>
  </div>

  <script>
    var deepLink = '';
    var hash = window.location.hash.substring(1);
    var search = window.location.search.substring(1);

    function parseParams(str) {
      var params = {};
      str.split('&').forEach(function(pair) {
        var parts = pair.split('=');
        if (parts[0] && parts[1]) {
          params[decodeURIComponent(parts[0])] = decodeURIComponent(parts[1]);
        }
      });
      return params;
    }

    var hashParams = parseParams(hash);
    var queryParams = parseParams(search);

    if (hashParams.type === 'recovery' && hashParams.access_token) {
      deepLink = 'stylevault://reset-password#' + hash;
    } else if (hashParams.access_token) {
      deepLink = 'stylevault://reset-password#' + hash;
    } else if (queryParams.code) {
      deepLink = 'stylevault://reset-password?code=' + queryParams.code;
    } else if (queryParams.access_token) {
      deepLink = 'stylevault://reset-password?' + search;
    } else {
      document.getElementById('desc').textContent =
        'Ce lien est invalide ou a expiré. Demandez un nouveau lien depuis l’application.';
      document.getElementById('loader').style.display = 'none';
      document.getElementById('errorBox').style.display = 'block';
    }

    if (deepLink) {
      document.getElementById('openBtn').href = deepLink;

      var timeout = setTimeout(function() {
        document.getElementById('desc').textContent =
          'Si l’application ne s’est pas ouverte automatiquement, appuyez sur le bouton ci-dessous.';
        document.getElementById('openBtn').style.display = 'inline-block';
        document.getElementById('loader').style.display = 'none';
        document.getElementById('errorBox').style.display = 'block';
      }, 1500);

      try {
        window.location.href = deepLink;
      } catch(e) {
        clearTimeout(timeout);
        document.getElementById('desc').textContent =
          'Appuyez sur le bouton ci-dessous pour ouvrir StyleVault.';
        document.getElementById('openBtn').style.display = 'inline-block';
        document.getElementById('loader').style.display = 'none';
        document.getElementById('errorBox').style.display = 'block';
      }
    }
  </script>
</body>
</html>
